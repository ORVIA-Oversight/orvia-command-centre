name: Command V3 Verify

on:
  push:
    branches:
      - command-v3-live-20260925
  pull_request:
    branches:
      - landscape-refit-20260925

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Runtime smoke
        env:
          COMMAND_PRIVATE_MODE: 'true'
          COMMAND_USERNAME: verify
          COMMAND_PASSWORD: verify
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run start -- -p 3000 > /tmp/command-v3.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true; cat /tmp/command-v3.log' EXIT
          for i in $(seq 1 20); do
            if curl -fsS -u verify:verify http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS -u verify:verify http://127.0.0.1:3000/ >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/workspace >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/work >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/projects >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/clients >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/library >/dev/null
          curl -fsS -u verify:verify http://127.0.0.1:3000/systems >/dev/null
